<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Western Reels</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav>
      <a class="brand" href="index.html">Western Reels</a>
      <div class="nav-links" id="nav-links"></div>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Criar conta</h1>
    </section>

    <form id="register-form" class="auth-form">
      <label>
        Nome de usuário
        <input type="text" id="reg-username" required autocomplete="username" />
      </label>
      <label>
        E-mail
        <input type="email" id="reg-email" required autocomplete="email" />
      </label>
      <label>
        Senha (mínimo 6 caracteres)
        <input type="password" id="reg-password" required minlength="6" autocomplete="new-password" />
      </label>
      <p class="form-error" id="form-error"></p>
      <button type="submit">Criar conta</button>
      <p class="form-footer-note">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
